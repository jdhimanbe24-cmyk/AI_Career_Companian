services:
  - type: web
    name: ai-career-placement-companion
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && python rag/create_database.py"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: APP_BASE_URL
        value: https://job-prep.xyz
