<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job - Career Companion</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style-v2.css') }}">
</head>

<body class="theme-admin">

<nav>
    <h2>Career Companion — Admin</h2>
    <div>
        <a href="/admin/dashboard">Dashboard</a>
        <a href="/admin/companies">Companies</a>
        <a href="/admin/jobs" class="active">Jobs</a>
        <a href="/admin/applications">Applications</a>
        <a href="/logout" class="nav-logout">Logout</a>
    </div>
</nav>

<div class="form-container">

    <h1>Edit Job</h1>
    <p>Update this posting's requirements, details, or deadline.</p>

    <form method="POST"
          action="/admin/job/edit/{{ job.id }}">

        <h2>Job Information</h2>

        <label>Company</label>

        <select name="company_id" required>

            {% for company in companies %}

                <option value="{{ company.id }}"
                    {% if company.id == job.company_id %}
                        selected
                    {% endif %}>

                    {{ company.name }}

                </option>

            {% endfor %}

        </select>

        <label>Job Title</label>

        <input type="text"
               name="title"
               value="{{ job.title }}"
               required>


        <label>Job Description</label>

        <textarea name="description">{{ job.description or '' }}</textarea>


        <h2>Requirements</h2>

        <label>Education</label>

        <textarea name="education">{{ job.education or '' }}</textarea>


        <label>Required Skills</label>

        <textarea name="required_skills">{{ job.required_skills or '' }}</textarea>


        <label>Recommended Qualities</label>

        <textarea name="recommended_qualities">{{ job.recommended_qualities or '' }}</textarea>


        <label>Preferred Qualities</label>

        <textarea name="preferred_qualities">{{ job.preferred_qualities or '' }}</textarea>


        <label>Experience</label>

        <textarea name="experience">{{ job.experience or '' }}</textarea>


        <label>Certifications</label>

        <textarea name="certifications">{{ job.certifications or '' }}</textarea>


        <h2>Job Details</h2>

        <label>Location</label>

        <input type="text"
               name="location"
               value="{{ job.location or '' }}">


        <label>Job Type</label>

        <select name="job_type">

            <option value="Internship"
                {% if job.job_type == "Internship" %}selected{% endif %}>
                Internship
            </option>

            <option value="Full Time"
                {% if job.job_type == "Full Time" %}selected{% endif %}>
                Full Time
            </option>

            <option value="Part Time"
                {% if job.job_type == "Part Time" %}selected{% endif %}>
                Part Time
            </option>

        </select>


        <label>CTC</label>

        <input type="text"
               name="ctc"
               value="{{ job.ctc or '' }}"
               placeholder="e.g. ₹12 LPA">


        <label>Stipend</label>

        <input type="text"
               name="stipend"
               value="{{ job.stipend or '' }}"
               placeholder="e.g. ₹30,000/month">


        <label>Application Deadline</label>

        <input type="date"
               name="deadline"
               value="{{ job.deadline or '' }}">

        <button type="submit">
            Update Job
        </button>

    </form>

</div>

</body>
</html>
